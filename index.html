<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1017">
  <title>DungeonCrawler — The Wildlands</title>
</head>
<body>
<div id="app">
  <header><h1>THE WILDLANDS</h1><span>DungeonCrawler · an endless expedition</span></header>
  <main>
    <section id="stats" aria-label="Character status"></section>
    <div id="game" aria-label="Dungeon map"></div>
    <p id="latest-event" role="status" aria-live="polite"></p>
    <nav id="touch-controls" aria-label="Touch game controls">
      <div class="dpad" aria-label="Movement">
        <button data-control="north" aria-label="Move north">▲</button>
        <button data-control="west" aria-label="Move west">◀︎</button>
        <button data-control="wait" aria-label="Wait one turn">Wait</button>
        <button data-control="east" aria-label="Move east">▶︎</button>
        <button data-control="south" aria-label="Move south">▼</button>
      </div>
      <div class="touch-actions">
        <button data-control="collect">Collect</button>
        <button data-control="descend">Enter ↓</button>
        <button data-control="potion">Potion</button>
        <button data-control="ascend">Leave ↑</button>
        <button data-control="vision">Vision · 25</button>
        <button data-control="help">Pause / Help</button>
      </div>
    </nav>
    <aside>
      <details id="satchel-panel" open><summary>Satchel / equipment</summary><div id="equipment-info" class="hint"></div><div id="inventory"></div></details>
      <details id="chronicle-panel" open><summary>Chronicle</summary><div id="log" role="log" aria-live="polite"></div></details>
      <button id="help">Pause / Help (Esc)</button>
      <p class="hint">WASD / Arrows: step or attack<br>E: collect / camp chest · H: potion<br>M: Mind Vision · Q: ascend<br>.: wait · Enter: enter / descend<br>I: inventory · Esc: pause</p>
    </aside>
  </main>
  <footer>Explore · Discover · Return home — v0.3.1 · Touch controls</footer>
</div>
<div id="overlay"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
